<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning mensuel — saisie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d0f;--bg2:#101316;--panel:#14181c;--panel2:#181d22;--line:#252c33;--line2:#313a42;
--txt:#dfe6ec;--muted:#9aa7b3;--muted2:#7c8893;--acc:#e8b006;--ok:#34d399;--err:#ef5350;
--c-RPM:#3aa6e8;--c-KZC:#34d399;--c-KRS:#8b7be8;--c-ASS:#f5a623;--c-AUT:#5b6b78;
--mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace}
body{background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:38px 38px;color:var(--txt);font-family:var(--mono);font-size:13px;padding-bottom:50px}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font:inherit;font-size:13px;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:5px;padding:8px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:54px}
label.fl{display:block;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:11px 0 5px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1114,#0b0d0f);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.brand h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.brand small{display:block;color:var(--muted2);font-size:9px;letter-spacing:.2em}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 12px;border-radius:6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:#fff}.btn.pri{background:var(--acc);color:#1a1404;border-color:var(--acc);font-weight:700}
.btn.sm{padding:5px 9px;font-size:10px}.icbtn{font-size:15px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;color:var(--muted)}.icbtn:hover{color:#fff;border-color:var(--acc)}
main{max-width:1080px;margin:14px auto;padding:0 12px}
.navmonth{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:12px}
.navmonth .m{font-size:16px;letter-spacing:.04em;min-width:200px;text-align:center;text-transform:capitalize}
.dow{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);text-align:center}
.cal{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:86px;padding:6px;cursor:pointer;position:relative;overflow:hidden;transition:.12s}
.cell:hover{border-color:var(--line2)}
.cell.empty{background:transparent;border:none;cursor:default}
.cell.today{box-shadow:inset 0 0 0 1px var(--acc)}
.cell .d{font-size:12px;color:var(--muted);font-weight:600}
.cell.weekend{background:#0e1114;border-color:#1c2228;opacity:.88}
.cell.weekend .d{color:var(--muted2)}
.cell.ouvre{background:#181d22;border-color:var(--line2)}
.cell.ouvre .d{color:var(--txt)}
.wk{display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.03em;color:var(--muted2);border-right:1px dashed var(--line)}
.cellfoot{display:flex;align-items:center;gap:5px;margin-top:4px}
.cellfoot .dose{font-size:9px;color:#7fd3ff;font-weight:700;white-space:nowrap}
.cellfoot .frb{font-size:9px;color:var(--muted);margin-left:auto}
.u{text-transform:none}
.cell .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.cell .ct{font-size:10px;font-weight:700;margin-top:3px}
.cell .si{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .hr{font-size:11px;color:var(--txt);margin-top:2px}
.cell .badges{position:absolute;right:5px;bottom:4px;display:flex;gap:3px;font-size:9px;color:var(--muted)}
.cell .typ{font-size:10px;color:var(--muted2);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.t-RPM{color:var(--c-RPM)}.t-KZC{color:var(--c-KZC)}.t-KRS{color:var(--c-KRS)}.t-ASS{color:var(--c-ASS)}.t-AUT{color:var(--c-AUT)}
.b-RPM{background:var(--c-RPM)}.b-KZC{background:var(--c-KZC)}.b-KRS{background:var(--c-KRS)}.b-ASS{background:var(--c-ASS)}.b-AUT{background:var(--c-AUT)}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 8px;text-align:center}
.kpi .n{font-size:20px;font-weight:600}.kpi .l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);margin-top:3px}
.repart{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:10px;border:1px solid var(--line2);border-radius:14px;padding:3px 10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:18px;padding:7px 13px;font-size:11px;color:var(--muted)}
.chip:hover{color:var(--txt)}.chip.on{background:var(--acc);color:#1a1404;border-color:var(--acc);font-weight:600}
.chip.on.cc-RPM{background:var(--c-RPM);border-color:var(--c-RPM);color:#04121c}
.chip.on.cc-KZC{background:var(--c-KZC);border-color:var(--c-KZC);color:#04140d}
.chip.on.cc-KRS{background:var(--c-KRS);border-color:var(--c-KRS);color:#0d0820}
.chip.on.cc-ASS{background:var(--c-ASS);border-color:var(--c-ASS);color:#1a1100}
.chip.on.cc-AUT{background:var(--c-AUT);border-color:var(--c-AUT);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;background:var(--panel);border-left:1px solid var(--line2);right:0;top:0;bottom:0;width:min(460px,100%);transform:translateX(100%);transition:.25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--line)}
.sheet .sh h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.sheet .sb{padding:15px;overflow-y:auto;flex:1}.sheet .sf{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:9px}.sheet .sf .btn{flex:1;text-align:center;padding:11px}
.row{display:flex;gap:9px}.row>*{flex:1}
.imp{background:var(--bg2);border:1px dashed var(--line2);border-radius:6px;padding:9px;font-size:13px;color:var(--ok);letter-spacing:.04em}
.imp.none{color:var(--muted2)}
.fr{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;margin-bottom:7px;display:flex;gap:9px;align-items:center;cursor:pointer}
.fr img{width:42px;height:42px;object-fit:cover;border-radius:5px;border:1px solid var(--line2);background:#000}
.fr .grow{flex:1;min-width:0}.fr .ca{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fr .mt{font-size:11px;color:var(--acc)}
.fr .dtw{font-size:9px;color:#f0a330}
.fred{background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:10px;margin-bottom:9px}
.fred-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.fred-top img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);background:#000}
.ocrst{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5;min-height:13px}
.ocrst.run{color:var(--acc)}.ocrst.ok{color:var(--ok)}.ocrst.warn{color:#f0a330}
.fred-bt{display:flex;gap:8px;margin-top:9px}
.note{font-size:10px;color:var(--muted2);margin-top:6px;line-height:1.45}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line2);border-radius:6px;padding:7px 11px;font-size:11px;color:var(--muted)}
.seg button.on{background:var(--acc);color:#1a1404;border-color:var(--acc);font-weight:600}
.add{border:1px dashed var(--line2);border-radius:7px;padding:10px;text-align:center;color:var(--muted);font-size:11px;width:100%}
.add:hover{border-color:var(--acc);color:#fff}
input[type=file]{display:none}
.empty-state{text-align:center;color:var(--muted2);font-size:12px;padding:20px}
@media(max-width:640px){.cell{min-height:72px}.brand small{display:none}.cell .si{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><div><h1>Planning mensuel</h1><small>SAISIE · IMPUTATION · DOSI · FRAIS</small></div></div>
  <span class="spacer"></span>
  <button class="icbtn" id="bParams" title="Paramètres">⚙</button>
  <button class="icbtn" id="bImport" title="Importer">⭱</button>
  <button class="icbtn" id="bExport" title="Exporter JSON">⭳</button>
  <button class="btn sm" id="bDosi">Dosimétrie</button>
  <button class="btn sm" id="bXlsDosi">Excel dosi</button>
  <button class="btn sm" id="bXlsH">Excel heures</button>
  <input type="file" id="fImport" accept="application/json">
</header>
<main>
  <div class="navmonth">
    <button class="icbtn" id="prev">‹</button>
    <div class="m" id="monthLabel">—</div>
    <button class="icbtn" id="next">›</button>
    <button class="btn sm" id="today">Auj.</button>
  </div>
  <div class="dow"><div>S</div><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div>
  <div class="cal" id="cal"></div>
  <div class="recap" id="recap"></div>
  <div class="repart" id="repart"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><h3 id="shTitle">—</h3><button class="icbtn" id="shClose">✕</button></div>
  <div class="sb" id="shBody"></div>
  <div class="sf" id="shFoot"></div>
</div>

<script>
"use strict";
/* ===== Constantes ===== */
const CONTRATS=[["RPM","RPM","RPM"],["KZC","KZC","KZC"],["KRS","KRS","KRS"],["Assistance hebdo","ASS","Assist."],["Autre","AUT","Autre"]];
const CKEY={"RPM":"RPM","KZC":"KZC","KRS":"KRS","Assistance hebdo":"ASS","Autre":"AUT"};
const SITES=["CNPE Belleville","CNPE Blayais","CNPE Bugey","CNPE Cattenom","CNPE Chinon","CNPE Chooz","CNPE Civaux","CNPE Cruas","CNPE Dampierre","CNPE Flamanville","CNPE Golfech","CNPE Gravelines","CNPE Nogent","CNPE Paluel","CNPE Penly","CNPE Saint-Alban","CNPE Saint-Laurent","CNPE Tricastin","DP2D Brennilis","DP2D Bugey 1","DP2D Chinon A","DP2D Chooz A","DP2D Creys-Malville","DP2D Fessenheim","DP2D Phénix","DP2D Saint-Laurent A","Bertin / Aix","Télétravail","Autre"];
const TYPES=["Travaillé","Déplacement","RTT","Congé payé","Férié","Récup","Maladie"];
const TRAVAIL=["Travaillé","Déplacement"];
const CATS=["Repas","Hôtel","Péage","Carburant","Km","Parking","Transport","Divers"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

/* ===== IndexedDB ===== */
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("ptv2-planning",1);
 r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("jours"))d.createObjectStore("jours",{keyPath:"date"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});};
 r.onsuccess=e=>{db=e.target.result;res();};r.onerror=()=>rej(r.error);});}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const jAll=()=>new Promise(r=>{const q=tx("jours","readonly").getAll();q.onsuccess=()=>r(q.result||[]);});
const jPut=o=>new Promise(r=>{const q=tx("jours","readwrite").put(o);q.onsuccess=()=>r();});
const jDel=k=>new Promise(r=>{const q=tx("jours","readwrite").delete(k);q.onsuccess=()=>r();});
const mGet=k=>new Promise(r=>{const q=tx("meta","readonly").get(k);q.onsuccess=()=>r(q.result?q.result.v:null);});
const mPut=(k,v)=>new Promise(r=>{const q=tx("meta","readwrite").put({k,v});q.onsuccess=()=>r();});

/* ===== État ===== */
const now=new Date();
let state={y:now.getFullYear(),m:now.getMonth()};
let DAYS={};   // date -> jour
let PARAMS={horaire:7.5,matricule:"",dosi:"",nom:"",prenom:"",sup:"",codes:{RPM:"",KZC:"",KRS:"","Assistance hebdo":"",Autre:""}};
let cur=null;  // jour en cours d'édition

const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ckey=c=>CKEY[c]||"AUT";
const siteShort=s=>s?s.replace("CNPE ","").replace("DP2D ","DP2D "):"";
const uid=()=>"f"+Date.now()+Math.random().toString(16).slice(2,7);

async function reload(){DAYS={};(await jAll()).forEach(j=>DAYS[j.date]=j);const p=await mGet("params");if(p)PARAMS=Object.assign(PARAMS,p);render();}

/* ===== Rendu calendrier ===== */
function render(){
  document.getElementById("monthLabel").textContent=`${MOIS[state.m]} ${state.y}`;
  const first=new Date(state.y,state.m,1);
  const off=(first.getDay()+6)%7;           // lundi=0
  const ndays=new Date(state.y,state.m+1,0).getDate();
  const todayIso=iso(now.getFullYear(),now.getMonth(),now.getDate());
  const cells=[];
  for(let i=0;i<off;i++)cells.push(null);
  for(let d=1;d<=ndays;d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  let h="";
  for(let w=0;w<cells.length/7;w++){
    const monday=new Date(state.y,state.m,w*7-off+1);
    h+=`<div class="wk">S${weekNum(monday)}</div>`;
    for(let k=0;k<7;k++){
      const d=cells[w*7+k];
      if(d==null){h+=`<div class="cell empty"></div>`;continue;}
      const date=iso(state.y,state.m,d);
      const dow=new Date(state.y,state.m,d).getDay();
      const we=(dow===0||dow===6)?"weekend":"ouvre";
      const j=DAYS[date];
      let inner=`<div class="d">${d}</div>`,bar="",dose="";
      if(j){
        const ds=(j.dose!=null&&j.dose!=="")?`<span class="dose">${j.dose} µSv</span>`:"";
        const fb=(j.frais&&j.frais.length)?`<span class="frb">€${j.frais.length}</span>`:"";
        const fr=(ds||fb)?`<div class="cellfoot">${ds}${fb}</div>`:"";
        if(TRAVAIL.includes(j.type)){
          const kc=ckey(j.contrat);
          bar=`<div class="bar b-${kc}"></div>`;
          inner+=`<div class="ct t-${kc}">${esc((CONTRATS.find(c=>c[0]===j.contrat)||["",""])[2]||j.contrat||"")}</div>
                  <div class="si">${esc(siteShort(j.site))}</div>
                  <div class="hr">${j.hNorm!=null?(j.hNorm+ (j.hSupp? "+"+j.hSupp:"")+"h"):""}</div>${fr}`;
        }else{
          inner+=`<div class="typ">${esc(j.type)}</div>${fr}`;
        }
      }
      h+=`<div class="cell ${we} ${date===todayIso?"today":""}" data-date="${date}">${bar}${inner}</div>`;
    }
  }
  document.getElementById("cal").innerHTML=h;
  document.querySelectorAll(".cell[data-date]").forEach(c=>c.onclick=()=>openDay(c.dataset.date));
  renderRecap();
}
function weekNum(d){const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-day+3);const f=new Date(Date.UTC(dt.getUTCFullYear(),0,4));return 1+Math.round(((dt-f)/86400000-3+((f.getUTCDay()+6)%7))/7);}
function monthDays(){return Object.values(DAYS).filter(j=>j.date.startsWith(`${state.y}-${pad(state.m+1)}`));}
function renderRecap(){
  const md=monthDays();
  let hn=0,hs=0,fr=0,trav=0,dose=0;
  const byC={},byS={};
  md.forEach(j=>{
    if(TRAVAIL.includes(j.type)){trav++;hn+=(+j.hNorm||0);hs+=(+j.hSupp||0);
      if(j.contrat)byC[j.contrat]=(byC[j.contrat]||0)+1;if(j.site)byS[j.site]=(byS[j.site]||0)+1;}
    (j.frais||[]).forEach(f=>fr+=(+f.montant||0));dose+=(+j.dose||0);
  });
  document.getElementById("recap").innerHTML=`
    <div class="kpi"><div class="n">${trav}</div><div class="l">Jours travaillés</div></div>
    <div class="kpi"><div class="n">${hn.toFixed(1)}</div><div class="l">Heures normales</div></div>
    <div class="kpi"><div class="n" style="color:var(--acc)">${hs.toFixed(1)}</div><div class="l">Heures supp.</div></div>
    <div class="kpi"><div class="n">${(hn+hs).toFixed(1)}</div><div class="l">Total heures</div></div>
    <div class="kpi"><div class="n" style="color:var(--ok)">${fr.toFixed(2)}€</div><div class="l">Frais du mois</div></div>
    <div class="kpi"><div class="n" style="color:#7fd3ff">${dose.toFixed(2)}</div><div class="l">Dose <span class="u">µSv</span></div></div>`;
  const rep=Object.entries(byC).map(([c,n])=>`<span class="tag">${esc(c)} : ${n} j</span>`).join("")
    +Object.entries(byS).map(([s,n])=>`<span class="tag">${esc(siteShort(s))} : ${n} j</span>`).join("");
  document.getElementById("repart").innerHTML=rep;
}

/* ===== Sheet ===== */
const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
function openSheet(title,body,footHTML){
  document.getElementById("shTitle").textContent=title;
  document.getElementById("shBody").innerHTML=body;
  document.getElementById("shFoot").innerHTML=footHTML;
  sheet.classList.add("open");scrim.classList.add("open");
}
function closeSheet(){sheet.classList.remove("open");scrim.classList.remove("open");cur=null;if(typeof killOCR==="function")killOCR();}
scrim.onclick=closeSheet;document.getElementById("shClose").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet.classList.contains("open"))closeSheet();});

/* ===== Saisie d'un jour ===== */
function calcHeures(){
  const deb=cur.debut,fin=cur.fin;
  if(deb&&fin){
    const [a,b]=deb.split(":").map(Number),[c,d]=fin.split(":").map(Number);
    let mins=(c*60+d)-(a*60+b)-Math.max(0,+cur.pause||0);
    if(mins<0)mins=0;
    const tot=Math.round(mins/6)/10;
    cur.total=tot;
    cur.hNorm=Math.min(tot,PARAMS.horaire);
    cur.hSupp=Math.max(0,+(tot-PARAMS.horaire).toFixed(2));
  }
}
function dayBodyHTML(){
  const k=ckey(cur.contrat);
  const code=cur.contrat?(PARAMS.codes[cur.contrat]||""):"";
  const worked=TRAVAIL.includes(cur.type);
  return `
  <label class="fl">Type de journée</label>
  <div class="seg" id="segType">${TYPES.map(t=>`<button data-t="${t}" class="${cur.type===t?"on":""}">${t}</button>`).join("")}</div>
  <div id="workZone" style="${worked?"":"display:none"}">
    <div class="row">
      <div><label class="fl">Début</label><input type="time" id="i_deb" value="${esc(cur.debut||"")}"></div>
      <div><label class="fl">Fin</label><input type="time" id="i_fin" value="${esc(cur.fin||"")}"></div>
      <div><label class="fl">Pause (min)</label><input type="number" min="0" id="i_pause" value="${esc(cur.pause!=null?cur.pause:60)}"></div>
    </div>
    <div class="row">
      <div><label class="fl">H. normales</label><input type="number" step="0.25" id="i_hn" value="${esc(cur.hNorm!=null?cur.hNorm:"")}"></div>
      <div><label class="fl">H. supp.</label><input type="number" step="0.25" id="i_hs" value="${esc(cur.hSupp!=null?cur.hSupp:"")}"></div>
      <div><label class="fl">Total</label><input id="i_tot" value="${esc(cur.total!=null?cur.total+" h":"")}" disabled></div>
    </div>
    <label class="fl" style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none"><input type="checkbox" id="i_traj" ${cur.trajet?"checked":""} style="width:auto;flex:0 0 auto"> Saisir des heures de trajet</label>
    <div id="trajZone" style="${cur.trajet?"":"display:none"}">
      <div class="row">
        <div><label class="fl">Aller départ</label><input type="time" id="i_tad" value="${esc(cur.tAD||"")}"></div>

function loadCanvas(file,max){ /* fichier image -> canvas (côté max `max`) */
  return new Promise((res,rej)=>{
    const draw=(src,w,h)=>{if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(src,0,0,w,h);return cv;};
    const viaImage=()=>{const url=URL.createObjectURL(file);const img=new Image();
      img.onload=()=>{URL.revokeObjectURL(url);const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return rej(new Error("image illisible"));
        try{res(draw(img,w,h));}catch(e){rej(new Error("mémoire insuffisante"));}};
      img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("format non supporté"));};
      img.src=url;};
    if(typeof createImageBitmap==="function")
      createImageBitmap(file).then(b=>{try{res(draw(b,b.width,b.height));}finally{b.close&&b.close();}}).catch(viaImage);
    else viaImage();});
}
function storeJpeg(cv,max){ /* canvas -> dataURL jpeg compressé pour stockage */

    c=document.createElement("canvas");c.width=Math.round(cv.width*s);c.height=Math.round(cv.height*s);
    c.getContext("2d").drawImage(cv,0,0,c.width,c.height);}

  if(z.scrollIntoView)z.scrollIntoView({block:"nearest"});

    z.innerHTML="";renderFrais();};
  const lance=async cv=>{
    st.className="ocrst run";st.textContent="Analyse…";
    try{
      const res=await ocrSmart(cv,(label,p)=>{st.textContent=label+"… "+Math.round(p*100)+" %";});
      const r=res.parsed;
      if(r.montant!=null&&!touched.m){item.montant=r.montant;g("fr_m").value=r.montant;}
      if(r.cat!=="Divers"&&!touched.c)setCat(r.cat);
      if(r.lib&&!touched.l){item.lib=r.lib;g("fr_l").value=r.lib;}
      item.dt=r.dateISO||null;
      const det=[r.cat!=="Divers"?r.cat:null,r.montant!=null?r.montant.toFixed(2)+" €":null,
        r.dateISO?r.dateISO.slice(8,10)+"/"+r.dateISO.slice(5,7):null].filter(Boolean);
      if(det.length){

    cv.width=img.width;cv.height=img.height;cv.getContext("2d").drawImage(img,0,0);lance(cv);};img.src=item.photo;};

function lastWorked(before){ /* dernier jour travaillé saisi avant `before` (sinon le plus récent) */

<script id=zipx>
"use strict";
/* ===== ZipX — patch chirurgical de classeurs xlsx/xlsm =====
   Modifie uniquement les cellules ciblées dans le XML des feuilles ;
   toutes les autres entrées du zip (styles, VBA, images, imprimante…)
   sont recopiées octet pour octet → mise en forme du modèle intacte. */
const ZipX=(()=>{
 const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
   return u8=>{let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=t[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};})();
 const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
 async function pipe(u8,Ctor,kind){const st=new Ctor(kind);const r=new Response(new Blob([u8]).stream().pipeThrough(st));return new Uint8Array(await r.arrayBuffer());}
 const inflate=u8=>pipe(u8,DecompressionStream,"deflate-raw");
 const deflate=u8=>pipe(u8,CompressionStream,"deflate-raw");
 const ENC=new TextEncoder(),DEC=new TextDecoder();

 async function open(b64){
   if(typeof DecompressionStream!=="function")throw new Error("Navigateur trop ancien (DecompressionStream requis)");
   const buf=b64u8(b64),dv=new DataView(buf.buffer);
   /* EOCD */
   let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
   if(e<0)throw new Error("zip invalide");
   const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
   const entries=[];
   for(let i=0;i<n;i++){
     if(dv.getUint32(p,true)!==0x02014b50)throw new Error("central dir corrompu");
     const method=dv.getUint16(p+10,true),time=dv.getUint16(p+12,true),date=dv.getUint16(p+14,true),
       crc=dv.getUint32(p+16,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true),
       nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),
       lo=dv.getUint32(p+42,true),name=DEC.decode(buf.subarray(p+46,p+46+nl));
     const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true),doff=lo+30+lnl+lel;
     entries.push({name,method,time,date,crc,csize,usize,data:buf.subarray(doff,doff+csize),mod:null,del:false});
     p+=46+nl+el+cl;
   }
   const find=name=>{const x=entries.find(t=>t.name===name&&!t.del);if(!x)throw new Error("absent du modèle : "+name);return x;};
   const cache={};
   return{
     has:name=>entries.some(t=>t.name===name&&!t.del),
     async text(name){const x=find(name);if(x.mod!=null)return x.mod;
       if(!(name in cache))cache[name]=DEC.decode(x.method===8?await inflate(x.data):x.data);return cache[name];},
     replace(name,str){find(name).mod=str;},
     remove(name){find(name).del=true;},
     async build(){
       const canZ=typeof CompressionStream==="function";
       const parts=[],cd=[];let off=0;
       for(const t of entries){
         if(t.del)continue;
         let method=t.method,crc=t.crc,csize=t.csize,usize=t.usize,data=t.data;
         if(t.mod!=null){const raw=ENC.encode(t.mod);crc=CRC(raw);usize=raw.length;
           if(canZ){data=await deflate(raw);method=8;}else{data=raw;method=0;}csize=data.length;}
         const nm=ENC.encode(t.name);
         const lh=new Uint8Array(30+nm.length),lv=new DataView(lh.buffer);
         lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,method,true);
         lv.setUint16(10,t.time,true);lv.setUint16(12,t.date,true);lv.setUint32(14,crc,true);
         lv.setUint32(18,csize,true);lv.setUint32(22,usize,true);lv.setUint16(26,nm.length,true);lv.setUint16(28,0,true);
         lh.set(nm,30);parts.push(lh,data);
         const ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);
         cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);cv.setUint16(10,method,true);
         cv.setUint16(12,t.time,true);cv.setUint16(14,t.date,true);cv.setUint32(16,crc,true);
         cv.setUint32(20,csize,true);cv.setUint32(24,usize,true);cv.setUint16(28,nm.length,true);
         cv.setUint32(42,off,true);ch.set(nm,46);cd.push(ch);
         off+=lh.length+data.length;
       }
       let cdLen=0;cd.forEach(c=>cdLen+=c.length);
       const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
       ev.setUint32(0,0x06054b50,true);ev.setUint16(8,cd.length,true);ev.setUint16(10,cd.length,true);
       ev.setUint32(12,cdLen,true);ev.setUint32(16,off,true);
       const total=off+cdLen+22,out=new Uint8Array(total);let q=0;
       for(const b of parts){out.set(b,q);q+=b.length;}for(const c of cd){out.set(c,q);q+=c.length;}out.set(eo,q);
       return out;
     }
   };
 }

 /* --- Édition de cellules dans le XML d'une feuille --- */
 const xesc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const colNum=c=>{let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n;};
 /* val : {n:nombre} | {s:texte} | null (vider, en gardant le style) */
 function setCell(xml,ref,val){
   const mk=attrs=>{
     if(val==null)return `<c r="${ref}"${attrs}/>`;
     if("n" in val)return `<c r="${ref}"${attrs}><v>${val.n}</v></c>`;
     const t=String(val.s),sp=/^\s|\s$/.test(t)?' xml:space="preserve"':"";
     return `<c r="${ref}"${attrs} t="inlineStr"><is><t${sp}>${xesc(t)}</t></is></c>`;};
   const re=new RegExp(`<c r="${ref}"([^>]*?)(/>|>[\\s\\S]*?</c>)`);
   const m=xml.match(re);
   if(m)return xml.replace(re,mk(m[1].replace(/\s+t="[^"]*"/,"")));
   if(val==null)return xml;
   /* cellule absente : insertion triée dans la ligne (qui doit exister dans le modèle) */
   const row=ref.match(/\d+$/)[0],cn=colNum(ref.match(/^[A-Z]+/)[0]);
   const rowRe=new RegExp(`(<row r="${row}"[^>]*>)([\\s\\S]*?)(</row>)`);
   const rm=xml.match(rowRe);
   if(!rm)throw new Error("ligne "+row+" absente du modèle");
   let cells=rm[2],at=cells.length;
   const cre=/<c r="([A-Z]+)\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g;let mm;
   while((mm=cre.exec(cells)))if(colNum(mm[1])>cn){at=mm.index;break;}
   return xml.replace(rowRe,rm[1]+cells.slice(0,at)+mk("")+cells.slice(at)+rm[3]);
 }
 /* chemin du sheetN.xml correspondant à un nom de feuille */
 async function sheetPath(z,name){
   const wb=await z.text("xl/workbook.xml");
   const m=wb.match(new RegExp(`<sheet[^>]*name="${name}"[^>]*r:id="(rId\\d+)"`))||wb.match(new RegExp(`<sheet[^>]*r:id="(rId\\d+)"[^>]*name="${name}"`));
   if(!m)throw new Error("feuille introuvable : "+name);
   const rels=await z.text("xl/_rels/workbook.xml.rels");
   const r=rels.match(new RegExp(`<Relationship[^>]*Id="${m[1]}"[^>]*Target="([^"]+)"`))||rels.match(new RegExp(`<Relationship[^>]*Target="([^"]+)"[^>]*Id="${m[1]}"`));
   if(!r)throw new Error("relation introuvable : "+m[1]);
   return "xl/"+r[1].replace(/^\//,"").replace(/^xl\//,"");
 }
 /* purge le cache d'ordre de calcul + force le recalcul à l'ouverture
    (nos valeurs écrasent des cellules dont dépendent les formules du modèle) */
 async function freshCalc(z){
   if(z.has("xl/calcChain.xml")){
     z.remove("xl/calcChain.xml");
     z.replace("[Content_Types].xml",(await z.text("[Content_Types].xml")).replace(/<Override[^>]*calcChain\.xml[^>]*\/>/,""));
     z.replace("xl/_rels/workbook.xml.rels",(await z.text("xl/_rels/workbook.xml.rels")).replace(/<Relationship[^>]*calcChain\.xml[^>]*\/>/,""));
   }
   let wb=await z.text("xl/workbook.xml");
   if(!/fullCalcOnLoad/.test(wb)){
     wb=/<calcPr/.test(wb)?wb.replace(/<calcPr/,'<calcPr fullCalcOnLoad="1"'):wb.replace(/<\/sheets>/,'</sheets><calcPr fullCalcOnLoad="1"/>');
     z.replace("xl/workbook.xml",wb);
   }
 }
 const save=(u8,filename,mime)=>{
   const a=document.createElement("a");
   a.href=URL.createObjectURL(new Blob([u8],{type:mime}));
   a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 };
 return{open,setCell,sheetPath,freshCalc,save};
})();

<script id=expDosi>
(function(){
 const SITE_KEY={"CNPE Belleville":"BELLEVILLE","CNPE Blayais":"BLAYAIS","CNPE Bugey":"BUGEY","CNPE Cattenom":"CATTENOM","CNPE Chinon":"CHINON","CNPE Chooz":"CHOOZ","CNPE Civaux":"CIVAUX","CNPE Cruas":"CRUAS","CNPE Dampierre":"DAMPIERRE","CNPE Flamanville":"FLAMANVILLE","CNPE Golfech":"GOLFECH","CNPE Gravelines":"GRAVELINES","CNPE Nogent":"NOGENT","CNPE Paluel":"PALUEL","CNPE Penly":"PENLY","CNPE Saint-Alban":"ST ALBAN","CNPE Saint-Laurent":"ST LAURENT B","CNPE Tricastin":"TRICASTIN","DP2D Bugey 1":"BUGEY","DP2D Chinon A":"CHINON","DP2D Chooz A":"CHOOZ","DP2D Creys-Malville":"CREYS","DP2D Fessenheim":"FESSENHEIM","DP2D Saint-Laurent A":"ST LAURENT A"};
 const CPREF={"RPM":"RP","KZC":"KZC","KRS":"KRS","Assistance hebdo":"RP","Autre":""};
 function dosiLabel(c,s){if(s==="Bertin / Aix")return"BERTIN";if(s==="Télétravail")return"Télétravail";if(!s||s==="Autre")return"Autre (préciser dans Observations)";const k=SITE_KEY[s];if(!k)return"Autre (préciser dans Observations)";const p=CPREF[c]!==undefined?CPREF[c]:"RP";return(p?p+" ":"")+k;}
 const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
 async function exportDosi(){try{
   PARAMS.nom=PARAMS.nom||"BEROUD-BLANC";PARAMS.prenom=PARAMS.prenom||"Romain";
   const z=await ZipX.open(DOSI_B64),path=await ZipX.sheetPath(z,"Sheet1");
   let x=await z.text(path);
   /* C2 (libellé du mois) et B39 (total dose) restent des formules du modèle : recalculées via B2/B3 */
   x=ZipX.setCell(x,"B2",{n:state.m+1});
   x=ZipX.setCell(x,"B3",{n:state.y});
   x=ZipX.setCell(x,"B4",{s:PARAMS.nom});
   x=ZipX.setCell(x,"B5",{s:PARAMS.prenom});
   if(PARAMS.dosi)x=ZipX.setCell(x,"B6",/^\d+$/.test(PARAMS.dosi)?{n:+PARAMS.dosi}:{s:PARAMS.dosi});
   for(let r=8;r<=38;r++)for(const c of["B","C","D"])x=ZipX.setCell(x,c+r,null);
   const nd=new Date(state.y,state.m+1,0).getDate();
   for(let d=1;d<=nd;d++){const j=DAYS[iso(state.y,state.m,d)];if(!j)continue;const r=7+d;
     if((j.type==="Travaillé"||j.type==="Déplacement")&&j.site){
       x=ZipX.setCell(x,"C"+r,{s:dosiLabel(j.contrat,j.site)});
       if(j.commentaire)x=ZipX.setCell(x,"D"+r,{s:j.commentaire});
       if(j.dose!=null&&j.dose!=="")x=ZipX.setCell(x,"B"+r,{n:+j.dose});}}
   z.replace(path,x);await ZipX.freshCalc(z);
   ZipX.save(await z.build(),"Dosimetrie_"+cap(MOIS[state.m])+"_"+state.y+".xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
 }catch(e){alert("Erreur export dosi : "+e.message);}}
 const b=document.getElementById("bXlsDosi");if(b)b.onclick=exportDosi;
})();
</script>

<script id=expHeures>
(function(){
 const dateSerial=(y,m,d)=>Math.round((Date.UTC(y,m,d)-Date.UTC(1899,11,30))/86400000);
 const FMAP={"Travaillé":"","Déplacement":"","RTT":"RTT","Congé payé":"CP","Férié":"Jour Férié","Récup":"Autre congé","Maladie":"Autre congé"};
 const toM=t=>{const p=(t||"").split(":");return p.length>=2?(+p[0])*60+(+p[1]):null;};
 function splitB(deb,fin,pause){const d=toM(deb),f=toM(fin);if(d==null||f==null)return null;const p=Math.max(0,pause||0),piv=720;
   if(p<=0)return{amD:d,amF:f,pmD:null,pmF:null};
   if(d<piv&&f>piv+p)return{amD:d,amF:piv,pmD:piv+p,pmF:f}; /* pause à midi (cas standard) */
   if(f-d<=p)return{amD:d,amF:f,pmD:null,pmF:null};         /* plage trop courte pour caser la pause */
   const mid=Math.round((d+f)/2),h=Math.floor(p/2);          /* sinon : pause au milieu de la plage */
   return{amD:d,amF:mid-h,pmD:mid-h+p,pmF:f};}
 function weekNum(d){const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-day+3);const f=new Date(Date.UTC(dt.getUTCFullYear(),0,4));return 1+Math.round(((dt-f)/86400000-3+((f.getUTCDay()+6)%7))/7);}
 async function fillWeek(Y,M,D){try{
   PARAMS.nom=PARAMS.nom||"BEROUD-BLANC";PARAMS.sup=PARAMS.sup||"MCAPELA";
   const z=await ZipX.open(FT_B64),path=await ZipX.sheetPath(z,"FT-TIS");
   let x=await z.text(path);
   const tf=mins=>mins/1440;
   for(let r=7;r<=13;r++)for(const C of["F","H","J","L","N","W"])x=ZipX.setCell(x,C+r,null);
   for(let r=21;r<=27;r++)for(const C of["H","J","L","N","W"])x=ZipX.setCell(x,C+r,null);
   x=ZipX.setCell(x,"H3",{n:dateSerial(Y,M,D)}); /* format date du modèle conservé */
   x=ZipX.setCell(x,"AA38",{s:PARAMS.nom});
   x=ZipX.setCell(x,"AK38",{s:PARAMS.sup});
   for(let i=0;i<7;i++){const dt=new Date(Y,M,D+i);const key=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
     const j=DAYS[key],row=7+i;if(!j)continue;const fl=FMAP[j.type];if(fl)x=ZipX.setCell(x,"F"+row,{s:fl});
     if(j.type==="Travaillé"||j.type==="Déplacement"){const sp=splitB(j.debut,j.fin,j.pause);
       if(sp){x=ZipX.setCell(x,"H"+row,{n:tf(sp.amD)});x=ZipX.setCell(x,"J"+row,{n:tf(sp.amF)});
         if(sp.pmD!=null){x=ZipX.setCell(x,"L"+row,{n:tf(sp.pmD)});x=ZipX.setCell(x,"N"+row,{n:tf(sp.pmF)});}
         const com=j.commentaire||((j.contrat||"")+(j.site?" "+j.site.replace("CNPE ","").replace("DP2D ","DP2D "):""));
         if(com)x=ZipX.setCell(x,"W"+row,{s:com});}
       if(j.trajet){const tr=row+14;const tt=k=>{const v=j[k];if(!v)return null;const q=v.split(":");return q.length>=2?(+q[0]*60+ +q[1])/1440:null;};
       const ad=tt("tAD"),af=tt("tAF"),rd=tt("tRD"),rf=tt("tRF");
       if(ad!=null)x=ZipX.setCell(x,"H"+tr,{n:ad});if(af!=null)x=ZipX.setCell(x,"J"+tr,{n:af});
       if(rd!=null)x=ZipX.setCell(x,"L"+tr,{n:rd});if(rf!=null)x=ZipX.setCell(x,"N"+tr,{n:rf});}
       if(j.site)x=ZipX.setCell(x,"W"+tr,{s:"Argis - "+j.site.replace("CNPE ","").replace("DP2D ","DP2D ")});
     }}
   z.replace(path,x);await ZipX.freshCalc(z);
   ZipX.save(await z.build(),"FeuilleTemps_S"+weekNum(new Date(Y,M,D))+"_"+Y+".xlsm","application/vnd.ms-excel.sheet.macroEnabled.12");
 }catch(e){alert("Erreur export heures : "+e.message);}}
 function pickWeek(){const first=new Date(state.y,state.m,1),off=(first.getDay()+6)%7;let mon=new Date(state.y,state.m,1-off);const last=new Date(state.y,state.m+1,0);const weeks=[];
   while(mon<=last){const m=new Date(mon),sun=new Date(mon);sun.setDate(m.getDate()+6);weeks.push([m,sun]);mon.setDate(mon.getDate()+7);}
   const fmt=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
   const body='<div class="note">Choisis la semaine (Lun→Dim) à exporter. Les jours hors mois affiché sont inclus s\'ils sont saisis.</div>'+weeks.map((w,i)=>'<button class="btn" style="width:100%;margin-bottom:8px" data-wk="'+i+'">Semaine du '+fmt(w[0])+' au '+fmt(w[1])+' · S'+weekNum(w[0])+'</button>').join('');
   openSheet('Feuille de temps — choisir la semaine',body,'<button class="btn" id="clW">Fermer</button>');
   document.getElementById('clW').onclick=closeSheet;
   document.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{const w=weeks[+b.dataset.wk][0];closeSheet();fillWeek(w.getFullYear(),w.getMonth(),w.getDate());});
 }
 const b=document.getElementById("bXlsH");if(b)b.onclick=pickWeek;
})();
</script>
